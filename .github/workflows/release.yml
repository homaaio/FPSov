name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Runs on tags like v1.0.0, v2.0.0, etc.

jobs:
  # Windows build
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Compile Windows
      run: |
        mkdir build\windows
        g++ -std=c++17 -O2 -static `
          src/windows/overlay.cpp `
          -o build/windows/fps-overlay.exe `
          -lgdi32 -lpdh -lpsapi -ldwmapi -lshell32 `
          -mwindows

        g++ -std=c++17 -O2 -shared -static `
          src/windows/settings_core.cpp `
          -o build/windows/settings_core.dll

        copy src\windows\settings.py build\windows\

    - name: Create Windows archive
      run: |
        Compress-Archive `
          -Path build\windows\* `
          -DestinationPath FPS-Overlay-Windows.zip

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: FPS-Overlay-Windows
        path: FPS-Overlay-Windows.zip

  # Linux build
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxext-dev python3

    - name: Compile Linux
      run: |
        mkdir -p build/linux

        # Not using -static: fully static-linking against X11/glibc is
        # unreliable on most distros (static X11 dev libs usually aren't
        # installed, and static glibc has known NSS/DNS issues).
        g++ -std=c++17 -O2 \
          src/linux/overlay.cpp \
          -o build/linux/fps-overlay \
          -lX11 -lXext -pthread

        g++ -std=c++17 -O2 -shared -fPIC \
          src/linux/settings_core.cpp \
          -o build/linux/libsettings_core.so

        cp src/linux/settings.py build/linux/fps-overlay-settings
        chmod +x build/linux/fps-overlay-settings
        cp src/linux/Makefile build/linux/

    - name: Create Linux archive
      run: |
        tar -czf FPS-Overlay-Linux.tar.gz -C build/linux .

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: FPS-Overlay-Linux
        path: FPS-Overlay-Linux.tar.gz

  # Create the GitHub release
  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: FPS-Overlay-Windows

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: FPS-Overlay-Linux

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ github.ref_name }}
        body: |
          ## FPS Overlay ${{ github.ref_name }}

          ### Windows
          - `FPS-Overlay-Windows.zip` — extract and run `fps-overlay.exe`

          ### Linux
          - `FPS-Overlay-Linux.tar.gz` — extract and run `./fps-overlay`

          ### Changes
          - System overlay for monitoring FPS/CPU/GPU
          - Drag-to-move support
          - Configurable via GUI (Python) or INI file
        files: |
          FPS-Overlay-Windows.zip
          FPS-Overlay-Linux.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
